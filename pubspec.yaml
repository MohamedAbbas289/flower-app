name: flower_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dart_either: ^2.1.0
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  fluttertoast: ^9.0.0
  get_it: ^9.2.1
  google_fonts: ^8.0.2
  injectable: ^3.0.0
  json_annotation: ^4.11.0
  pinput: ^6.0.2
  pretty_dio_logger: ^1.3.1
  retrofit: ^4.9.0
  skeletonizer: ^2.1.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.13.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.0.2
  json_serializable: ^6.10.0
  mockito: ^5.6.4
  mocktail: ^1.0.4
  retrofit_generator: ^10.0.1
  test: ^1.29.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

flutter_assets:
  assets_path: assets/
  output_path: lib/core/values/
  filename: images_paths.dart
  ignore_comments: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_android: "assets/images/app_icon.png"
  image_path: "assets/icons/app_icon.png"
  image_path_ios: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  min_sdk_android: 21
